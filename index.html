<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Gerber-Soft" />
  <meta name="copyright" content="© 2026 Gerber-Soft. Alle Rechte vorbehalten." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SubmitOne | Projektmanager</title>
  <!-- Derselbe Wert wie in SubZeit und der Projektmappe. Stand bis zum
       14.08.2026 auf #faf9f5 — einem Creme aus der Palette vor Violett,
       das es seit Monaten nicht mehr gibt. -->
  <meta name="theme-color" content="#0b0a12" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SubmitOne" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- Genau dieselbe Anforderung wie in SubZeit und der Projektmappe.
       SubmitOne holte bisher Quicksand in 400 und 500, benutzt die Schrift
       aber nur im Schriftzug (600/700) — zwei Schnitte umsonst geladen.
       Inter 300 fehlte dafür, obwohl die gemeinsamen Bausteine es kennen. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Zuerst die gemeinsamen Tokens, dann was SubmitOne daraus macht.
       Dieselbe Datei liest auch Submit Paper, Submit PDF, die Projektmappe
       und SubZeit — eine Änderung dort wirkt in allen fünf. -->
  <link rel="stylesheet" href="ui/tokens.css" />
  <!-- Und daraus die Bausteine: Knopf, Karte, Eingabe, Tabelle, Fenster,
       Menü, Meldung. Bis zum 14.08.2026 kamen SubZeit und die Projektmappe
       an diese Datei, SubmitOne nicht — daher die kleinen Unterschiede in
       Polsterung und Radien, die man beim Wechsel sah. -->
  <link rel="stylesheet" href="ui/bausteine.css" />
  <!-- Das Wochenraster sieht in SubmitOne und SubZeit gleich aus, weil
       beide dieselbe Datei laden. -->
  <link rel="stylesheet" href="ui/wochenraster.css" />
  <link rel="stylesheet" href="styles.css?v=409" />
</head>
<body>
  <!-- Randlose App (Window-Controls-Overlay): ziehbare Fensterleiste in Marken-Grün; nur bei installierter App aktiv -->
  <div id="wcoBar" class="wco-bar" aria-hidden="true"></div>

  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo on-dark compact">
          <span class="logo-word"><span class="lw-a">Submit</span><span class="lw-b">One</span></span>
          <svg class="logo-tick" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="11" class="end"/>
            <path d="M6.6 12.4 l3.4 3.6 l7-8.6" class="chk"/>
          </svg>
        </span>
        <span class="logo on-dark logo-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" class="end"/><path d="M6.6 12.4 l3.4 3.6 l7-8.6" class="chk"/></svg>
          <span class="logo-mark-name"><span class="lw-a">Submit</span><span class="lw-b">One</span></span>
        </span>
      </div>
      <button class="sidebar-toggle" id="btnCollapse" title="Menü ein-/ausklappen" aria-label="Menü ein-/ausklappen">«</button>
      <nav class="nav" id="mainNav">
        <a href="#/dashboard" data-nav="dashboard" data-mobil="1" title="Dashboard"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> <span class="nav-txt">Dashboard</span></a>
        <a href="#/projekte"  data-nav="projekte" data-mobil="1" title="Projekte"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span> <span class="nav-txt">Projekte</span></a>
        <div id="projSubnav" class="subnav"></div>
        <a href="#/kalender"  data-nav="kalender" title="Kalender"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span> <span class="nav-txt">Kalender</span></a>
        <a href="#/pendenzen" data-nav="pendenzen" data-mobil="1" title="Pendenzen"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 12l2 2 4-4"/></svg></span> <span class="nav-txt">Pendenzen</span></a>
        <a href="#/planung"   data-nav="planung" title="Wochenplanung"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8 13.5h8M8 17h5"/></svg></span> <span class="nav-txt">Wochenplanung</span></a>
        <a href="#/stunden"   data-nav="stunden" title="Stunden – dieselben Einträge wie in SubZeit"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 1.9"/></svg></span> <span class="nav-txt">Stunden</span></a>
        <a href="#/erfassen"  data-nav="erfassen" data-mobil="1" title="Erfassen"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></span> <span class="nav-txt">Erfassen</span></a>
        <a href="#/drucken"   data-nav="drucken" title="Drucken"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 17h10v4H7z"/></svg></span> <span class="nav-txt">Drucken</span></a>
        <a href="#/kontakte"  data-nav="kontakte" title="Kontakte"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg></span> <span class="nav-txt">Kontakte</span></a>
        <a href="#/dokumente" data-nav="dokumente" title="Dokumente"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 2.5h8l4 4v15H6z"/><path d="M14 2.5v4h4M9 13h6M9 17h6"/></svg></span> <span class="nav-txt">Dokumente</span></a>
        <a href="#/einstellungen" data-nav="einstellungen" title="Einstellungen"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="15" cy="7" r="2.4"/><circle cx="7" cy="17" r="2.4"/></svg></span> <span class="nav-txt">Einstellungen</span></a>
        <!-- Nur auf dem Handy sichtbar. Dort tragen vier Punkte einen festen
             Platz (data-mobil), die übrigen sieben liegen dahinter. Vorher
             standen alle elf in einer Reihe, die seitlich rollte — mit
             verstecktem Rollbalken, also ohne jeden Hinweis darauf. Von elf
             Funktionen waren fünf sichtbar und sechs faktisch verborgen. -->
        <button class="nav-mehr" id="btnNavMehr" type="button" title="Weitere Bereiche" aria-haspopup="dialog">
          <span class="nav-ico" aria-hidden="true">⋯</span> <span class="nav-txt">Mehr</span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="user-chip" id="userChip" hidden></div>
        <div class="foot-row">
          <button class="btn-ghost-sm" id="btnUndo" title="Rückgängig (Strg+Z)" disabled><span class="fi">↶</span><span class="ft">Zurück</span></button>
          <button class="btn-ghost-sm" id="btnRedo" title="Wiederholen (Strg+Y)" hidden disabled><span class="fi">↷</span><span class="ft">Vor</span></button>
        </div>
        <button class="btn-ghost-sm" id="btnExport" title="Daten exportieren"><span class="fi">⬇</span><span class="ft">Export</span></button>
        <!-- Fokus und Vollbild stehen IN der Fusszeile, nicht als
             schwebende Leiste. Als schwebende lagen sie erst auf den
             Kopfzeilenknoepfen, dann auf den Karten, dann auf dem
             Zurueck-Knopf - jedes Mal an anderer Stelle, weil ein
             fester Abstand nie zu einer Fusszeile passt, deren Hoehe
             sich mit ihrem Inhalt aendert. Im Fluss kann das nicht
             mehr passieren. -->
        <div id="focusbar" class="focusbar">
          <button id="btnFocus" class="fb-btn" title="Modul-Fokus: Navigation, Projekt-Reiter & Titel ausblenden – maximale Fläche für Baukosten/Gantt">⤢ <span class="fb-t">Fokus</span></button>
          <button id="btnFullscreen" class="fb-btn" title="Vollbild ein/aus (Browser-Rahmen weg)">⛶ <span class="fb-t">Vollbild</span></button>
        </div>
        <div class="ver">Prototyp · v0.1</div>
        <div class="user-vert" id="userVert" title="Angemeldet"></div>
      </div>
    </aside>

    <main class="content">
      <div id="view"></div>
    </main>
  </div>

  <div id="statusBar" class="statusbar" aria-live="polite"></div>


  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=380"></script>
  <!-- Ordner-Modus: Reihenfolge zaehlt, ordner.js greift beim Laden auf Uebersetzer zu -->
  <script src="submit/kern/zeitrechnung.js?v=1"></script>
  <script src="submit/kern/wochenraster.js?v=1"></script>
  <script src="submit/kern/uebersetzer.js?v=1"></script>
  <script src="submit/kern/ordner.js?v=1"></script>
  <script src="submit/kern/ablage-browser.js?v=1"></script>
  <script src="app.js?v=414"></script>
  <script src="bridge.js?v=1"></script>
  <script src="appswitch.js?v=3"></script>
</body>
</html>
