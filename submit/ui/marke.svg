<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Submit One">
  <!--
    Edelweiss-Marke als Favicon. Bewusst nachgezeichnet statt aus dem Foto geschnitten:
    Bei 16 Pixeln bliebe von einer Fotovorlage nur ein Fleck übrig. Die Blüte ist deshalb
    flächig und mit wenigen, kräftigen Blättern angelegt.
  -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d489"/>
      <stop offset=".45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#b07d2a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="#14120d"/>

  <g transform="translate(32 32)" fill="url(#gold)">
    <!-- Äussere Blätter, achtfach im 45-Grad-Schritt. -->
    <g id="outer">
      <path id="petal" d="M0-23 C3.6-14.6 4.7-7.3 2.6-3.1 C1.6-1 -1.6-1 -2.6-3.1 C-4.7-7.3 -3.6-14.6 0-23 Z"/>
      <use href="#petal" transform="rotate(45)"/>
      <use href="#petal" transform="rotate(90)"/>
      <use href="#petal" transform="rotate(135)"/>
      <use href="#petal" transform="rotate(180)"/>
      <use href="#petal" transform="rotate(225)"/>
      <use href="#petal" transform="rotate(270)"/>
      <use href="#petal" transform="rotate(315)"/>
    </g>

    <!-- Innere, kürzere Blätter versetzt dazwischen. -->
    <g opacity=".82" transform="rotate(22.5) scale(.6)">
      <use href="#outer"/>
    </g>

    <!-- Blütenmitte. -->
    <circle r="3.4" fill="#f7e3ae"/>
  </g>
</svg>
